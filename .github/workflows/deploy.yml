name: Deploy to Github Pages

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch uses that name


# Required permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: |
          npx elm-land build
          sed -i 's|src="/|src="/goldfish/|g' dist/index.html
          sed -i 's|href="/|href="/goldfish/|g' dist/index.html
          cp dist/index.html dist/404.html
          cp -r goldfish/* dist/

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
